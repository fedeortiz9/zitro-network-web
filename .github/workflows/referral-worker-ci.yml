name: Referral Worker CI

# F-10: un mismo job cubre dos eventos.
#
#   - `pull_request` valida los cambios propuestos en un PR.
#   - `push` valida `main` cuando el commit toca alguno de los `paths`
#     listados. Un push a `main` que no toque ninguno de esos paths no
#     ejecuta el job; el filtro es deliberadamente el mismo que ya usaba
#     `pull_request`, para no cambiar de paso qué se considera un cambio
#     relevante.
#
# Antes de añadir `push`, `main` no tenía verificación propia: lo que se
# validaba era la merge-result de cada PR, no el commit que quedaba en la
# rama, y un push directo no ejecutaba nada. Es el MISMO job en ambos casos,
# de modo que no hay un segundo pipeline que pueda divergir.
#
# Los dos eventos cubren situaciones distintas y en el flujo habitual no se
# solapan, pero eso no es una garantía de ejecución única: un commit que sea a
# la vez push a `main` y cabeza de un PR abierto -- por ejemplo un PR desde
# `main` hacia otra rama -- puede disparar ambos.
on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".well-known/**"
      - ".github/workflows/referral-worker-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "wrangler.toml"
      - ".well-known/**"
      - ".github/workflows/referral-worker-ci.yml"

permissions:
  contents: read

jobs:
  worker:
    name: Worker tests and dry-run validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
      - run: git diff --check
